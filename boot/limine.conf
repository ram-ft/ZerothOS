# Limine Bootloader Configuration for Zeroth OS
# Dual-Boot Compatible: UEFI (Modern Laptops) & BIOS (Legacy PCs)

timeout: 3
default_entry: 1

/Zeroth OS (Ultra-Lightweight Desktop)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    resolution: 1280x720x32

/Zeroth OS (Full HD 1080p)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    resolution: 1920x1080x32

/Zeroth OS (Safe Mode - 1024x768 for Old Laptops)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    resolution: 1024x768x32
